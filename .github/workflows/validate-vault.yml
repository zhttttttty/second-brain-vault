name: Validate Vault

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Vault contracts
        run: python .agents/skills/system-sync/scripts/validate_vault.py --vault . --strict
